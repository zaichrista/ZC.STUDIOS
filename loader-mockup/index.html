<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZC loader mockup: monogram draw</title>
<link rel="stylesheet" href="https://use.typekit.net/adg0sut.css">
<style>
:root{--ink:#0C0B09;--paper:#F6F5F3;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:"sets-grotesk-s","Helvetica Neue",Arial,sans-serif}
/* fake home page underneath */
.home{position:fixed;inset:0;display:flex;align-items:flex-end;overflow:hidden}
.home .mark{font-family:"sets-grotesk-l","Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:23vw;line-height:.8;letter-spacing:-.015em;white-space:nowrap;padding:0 .02em;transform:translateY(105%)}
.home .tag{position:absolute;top:17.5vh;left:0;right:0;text-align:center;font-size:clamp(22px,3.3vw,56px);opacity:0}
/* loader */
#loader{position:fixed;inset:0;z-index:5;background:var(--ink);display:flex;align-items:center;justify-content:center}
#logo{position:relative;height:min(58vh,560px);aspect-ratio:1681/2000}
#logo svg{position:absolute;inset:0;width:100%;height:100%}
#logo svg{filter:invert(1);overflow:visible}
#logo path,#logo rect:not(.all){fill:none;stroke:#fff;stroke-linejoin:miter;stroke-linecap:butt;stroke-dasharray:1;stroke-dashoffset:1}
/* timeline (total ~3.7s): frame -> C -> Z -> settle to exact artwork -> loader lifts, wordmark rises */
.run #frame{animation:draw 1s cubic-bezier(.65,0,.35,1) .1s forwards}
.run #c{animation:draw 1.15s cubic-bezier(.65,0,.35,1) .75s forwards}
.run #z{animation:draw 1.2s cubic-bezier(.65,0,.35,1) 1.5s forwards}
.run #loader{animation:lift .8s var(--ease) 3.4s forwards}
.run #logo{animation:settle .8s var(--ease) 3.4s forwards}
.run .home .mark{animation:rise 1.4s var(--ease) 3.4s forwards}
.run .home .tag{animation:fade 1s ease 4.5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes lift{to{opacity:0;visibility:hidden}}
@keyframes settle{to{transform:scale(1.06);opacity:0}}
@keyframes rise{to{transform:none}}
button{position:fixed;right:20px;bottom:20px;z-index:9;font:inherit;background:var(--paper);color:var(--ink);border:0;border-radius:2em;padding:.6em 1.2em;cursor:pointer}
@media(prefers-reduced-motion:reduce){.run *{animation-duration:.01ms!important;animation-delay:0s!important}}
</style></head><body>
<div class="home"><p class="tag">the future of branding is culture led.</p><div class="mark">ZC Studios</div></div>
<div id="loader"><div id="logo">
  <svg viewBox="0 0 1681 2000" aria-hidden="true">
    <defs>
      <mask id="mF" maskUnits="userSpaceOnUse" x="-50" y="-50" width="1781" height="2100"><path id="frame" pathLength="1" stroke-width="64" d="M-30 27.5H1653.5V1972.5H27.5V-30"/></mask>
      <mask id="mC" maskUnits="userSpaceOnUse" x="-50" y="-50" width="1781" height="2100"><path id="c" pathLength="1" stroke-width="150" d="M1583.7 840A742 768 0 1 0 1585.7 1150"/></mask>
      <mask id="mZ" maskUnits="userSpaceOnUse" x="-50" y="-50" width="1781" height="2100"><path id="z" pathLength="1" stroke-width="100" d="M100 136H1489L165 1863H1620"/></mask>
    </defs>
    <image href="layer-frame.png" width="1681" height="2000" mask="url(#mF)"/>
    <image href="layer-c.png" width="1681" height="2000" mask="url(#mC)"/>
    <image href="layer-z.png" width="1681" height="2000" mask="url(#mZ)"/>
  </svg>
</div></div>
<button id="replay">replay</button>
<script>
const b=document.body;
function play(){b.classList.remove('run');void b.offsetWidth;b.classList.add('run')}
document.getElementById('replay').onclick=play;
const t=new URLSearchParams(location.search).get('t');
if(t!==null){b.classList.add('run');document.getElementById('replay').remove();
  requestAnimationFrame(()=>{});setTimeout(()=>document.getAnimations().forEach(a=>{a.pause();a.currentTime=+t}),50)}
else play();
</script></body></html>
